<div class="upload">

    <input
        id="cameraInput"
        type="file"
        accept="image/*,.heic,.heif"
        capture="environment"
        hidden
    >

    <input
        id="galleryInput"
        type="file"
        accept="image/*,.heic,.heif"
        multiple
        hidden
    >

    <div class="upload-title">
        <span>🧾</span>
        <div>
            <strong>Adicionar cupom</strong>
            <small>Escolha uma das opções abaixo</small>
        </div>
    </div>

    <div class="upload-options">

        <button
            type="button"
            id="takePhoto"
            class="upload-option"
        >
            <span class="upload-icon">📷</span>

            <strong>
                Tirar foto
            </strong>

            <small>
                Usar a câmera
            </small>
        </button>


        <button
            type="button"
            id="selectPhoto"
            class="upload-option"
        >
            <span class="upload-icon">🖼️</span>

            <strong>
                Selecionar foto
            </strong>

            <small>
                Galeria ou arquivos
            </small>
        </button>

    </div>

</div>
